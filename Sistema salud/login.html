<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IUJO SaludConnect - Iniciar Sesión</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-wrapper">

  <main class="auth-card">
    <header class="auth-header">
      <h1 class="text-brand-primary">IUJO SaludConnect</h1>
      <p class="text-muted text-sm">Gestión de Salud Integral</p>
    </header>

    <form action="dashboard.html" method="GET">
      <p class="form-group">
        <label for="usuario">Usuario o Correo Electrónico</label>
        <input type="text" id="usuario" name="usuario" class="form-control" placeholder="ejemplo@iujo.edu.ve" required>
      </p>

      <p class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </p>

      <p class="flex-between mb-4 text-sm">
        <label class="flex-items-center gap-2 font-normal">
          <input type="checkbox" name="remember"> Recordar sesión
        </label>
        <a href="#" class="text-brand-primary">¿Olvidaste tu contraseña?</a>
      </p>

      <button type="submit" class="btn btn-primary w-full">Ingresar al Sistema</button>
    </form>

    <footer class="text-center mt-6 text-sm">
      <p class="text-muted">¿No tienes cuenta? <a href="registro.html" class="text-brand-primary">Crear una cuenta pública</a></p>
    </footer>
  </main>

</body>
</html>
